<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biểu mẫu đăng nhập Inline</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome CSS -->
  <link rel="stylesheet" href="all.min.css">
</head>
<body class="bg-light">

<div class="container my-5">
  <div class="card shadow-sm">
    <div class="card-header bg-info text-primary fw-bold text-start">
      Biểu mẫu đăng nhập
    </div>
    <div class="card-body">
      <form class="d-flex align-items-center flex-wrap gap-3">
        <!-- Email -->
        <div class="d-flex align-items-center">
          <label for="email" class="fw-bold fw-bold me-2 mb-0">
            <i class="fas fa-envelope text-danger me-1"></i>Email:
          </label>
          <input type="email" class="form-control" id="email" placeholder="Nhập vào email">
        </div>

        <!-- Mật khẩu -->
        <div class="d-flex align-items-center">
          <label for="password" class="fw-bold fw-bold me-2 mb-0">
            <i class="fas fa-lock text-secondary me-1"></i>Mật khẩu:
          </label>
          <input type="password" class="form-control" id="password" placeholder="Nhập vào mật khẩu">
        </div>

        <!-- Checkbox -->
        <div class="form-check ms-3">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label fw-bold" for="remember">
            Ghi nhớ tôi
          </label>
        </div>

        <!-- Nút đăng nhập -->
        <button type="submit" class="btn btn-primary fw-bold ms-3">
          <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
        </button>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
